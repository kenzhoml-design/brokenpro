<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Perkenalan Saya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Share Tech Mono", monospace;
            font-weight: 400;
            font-style: normal;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column; /* Mengatur susunan ke bawah secara vertikal */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Kartu putih utama (aman, tidak ikut merespons saat status disentuh) */
        .card {
            background-color: white;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            border: 2px solid black;
            overflow: hidden;
            text-align: center;
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #007BFF;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #222;
        }

        .title {
            color: #007BFF;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 20px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .skill-badge {
            background-color: #e7f1ff;
            color: #007BFF;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-contact {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            width: 100%;      
            background-color: #007BFF;
            color: #000000;
            border: 2px solid black;
            text-decoration: none;
            border-radius: 10px;
            font-weight: normal;
            transition: transform 0.2s ease;
            outline: none;
        }

        .btn-contact:active {
            transform: scale(0.98);
        }

        /* Bagian Status di LUAR kartu, berdiri sendiri */
        .argan {
            color: #000000;
            margin-top: 15px; /* Jarak antara kartu putih dan teks status di bawahnya */
            padding: 5px 10px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Hanya teks ini yang merespons saat disentuh/di-hover */
        .argan:hover {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
            width: 329px;
            border: 1.5px solid lab(0% 0 0);
        }
    </style>
</head>
<body>

    <!-- Kotak Putih Utama (Bersih tanpa status di dalamnya) -->
    <div class="card">
        <!-- Foto Profil -->
        <img src="https://i.ibb.co.com/V0hJfcnV/file-0000000099388207a97ab1a6d1a13c13.png" alt="Foto Profil" class="profile-img">

        <!-- Nama & Profesi/Status -->
        <h1>KENZHO Q.C</h1>
        <p class="title">PROGAMER AND INVESTRADER</p>

        <!-- Biografi Singkat -->
        <p class="bio">
            Selamat Datang,Massih pake ai banyak gaya lu suki rawrrrr kenzho ganteng and probanget.
        </p>

        <!-- Skill/Keahlian -->
        <div class="skills">
            <span class="skill-badge">HTML</span>
            <span class="skill-badge">CSS</span>
            <span class="skill-badge">JavaScript</span>
        </div>

        <!-- Tombol Kontak -->
        <a href="https://wa.me/6283183392289" class="btn-contact">HUBUNGI KENZ</a>
    </div>

    <!-- Teks Status Berada di Luar Card (Di bawahnya persis seperti gambar aslimu) -->
    <div class="argan">STATUS BRO: SINGLE</div>

</body>
</html>
